name: Publish

on:
  push:
    branches:
      - beta
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Determine tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/beta" ]]; then
            echo "NPM_TAG=beta" >> $GITHUB_OUTPUT
          else
            echo "NPM_TAG=latest" >> $GITHUB_OUTPUT
          fi

      - name: Get package version
        id: package
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if version exists on npm
        id: check_version
        run: |
          if npm view @xxanderwp/jstoolkit@${{ steps.package.outputs.VERSION }} version 2>/dev/null; then
            echo "VERSION_EXISTS=true" >> $GITHUB_OUTPUT
          else
            echo "VERSION_EXISTS=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm (if version doesn't exist)
        if: steps.check_version.outputs.VERSION_EXISTS == 'false'
        run: npm publish --tag ${{ steps.tag.outputs.NPM_TAG }} --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Add dist-tag (if version exists)
        if: steps.check_version.outputs.VERSION_EXISTS == 'true'
        run: |
          npm dist-tag add @xxanderwp/jstoolkit@${{ steps.package.outputs.VERSION }} ${{ steps.tag.outputs.NPM_TAG }}
          echo "Version ${{ steps.package.outputs.VERSION }} already exists. Added tag: ${{ steps.tag.outputs.NPM_TAG }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release (only on main and if new version)
        if: github.ref == 'refs/heads/main' && steps.check_version.outputs.VERSION_EXISTS == 'false'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.package.outputs.VERSION }}
          release_name: Release v${{ steps.package.outputs.VERSION }}
          draft: false
          prerelease: false